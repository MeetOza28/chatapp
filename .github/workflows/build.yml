name: Build and Push to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      # ── 1. Checkout ───────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup pnpm ─────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      # ── 3. Setup Node.js ──────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # ── 4. Install frontend dependencies ──────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── 5. Type check frontend ────────────────────────────
      - name: Type check frontend
        run: pnpm --filter web type-check

      # ── 6. Lint frontend ──────────────────────────────────
      - name: Lint frontend
        run: pnpm --filter web lint

      # ── 7. Setup Python ───────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      # ── 8. Install uv ─────────────────────────────────────
      - name: Install uv
        run: pip install uv

      # ── 9. Cache uv dependencies ──────────────────────────
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}

      # ── 10. Install backend dependencies ──────────────────
      - name: Install backend dependencies
        run: |
          cd apps/api
          uv sync --frozen --no-dev

      # ── 11. Build Next.js frontend ────────────────────────
      - name: Build Next.js frontend
        env:
          NEXT_PUBLIC_WS_URL: ${{ secrets.NEXT_PUBLIC_WS_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          DRIZZLE_DATABASE_URL: ${{ secrets.DRIZZLE_DATABASE_URL }}
          NODE_ENV: production
        run: pnpm --filter web build

      # ── 12. Setup Docker Buildx ───────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 13. Login to GHCR ─────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 14. Build and push web image ──────────────────────
      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chatapp-web:latest
            ghcr.io/${{ github.repository_owner }}/chatapp-web:${{ github.sha }}
          build-args: |
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
            BETTER_AUTH_URL=${{ secrets.BETTER_AUTH_URL }}
            DRIZZLE_DATABASE_URL=${{ secrets.DRIZZLE_DATABASE_URL }}
            NEXT_PUBLIC_WS_URL=${{ secrets.NEXT_PUBLIC_WS_URL }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}

      # ── 15. Build and push api image ──────────────────────
      - name: Build and push api image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chatapp-api:latest
            ghcr.io/${{ github.repository_owner }}/chatapp-api:${{ github.sha }}

      # ── 16. Done ──────────────────────────────────────────
      - name: Build summary
        run: |
          echo "=================================="
          echo "🚀 ChatApp Build Complete"
          echo "✅ Frontend built"
          echo "✅ Backend built"
          echo "✅ Images pushed to GHCR"
          echo "ghcr.io/${{ github.repository_owner }}/chatapp-web:${{ github.sha }}"
          echo "ghcr.io/${{ github.repository_owner }}/chatapp-api:${{ github.sha }}"
          echo "=================================="
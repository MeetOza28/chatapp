name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      # ── 1. Checkout ───────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup pnpm ─────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      # ── 3. Setup Node.js ──────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # ── 4. Install frontend dependencies ──────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── 5. Type check frontend ────────────────────────────
      - name: Type check frontend
        run: pnpm --filter web type-check

      # ── 6. Lint frontend ──────────────────────────────────
      - name: Lint frontend
        run: pnpm --filter web lint

      # ── 7. Setup Python ───────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      # ── 8. Install uv ─────────────────────────────────────
      - name: Install uv
        run: pip install uv

      # ── 9. Cache uv dependencies ──────────────────────────
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}

      # ── 10. Install backend dependencies ──────────────────
      - name: Install backend dependencies
        run: |
          cd apps/api
          uv sync --frozen --no-dev

      # ── 11. Build Next.js frontend ────────────────────────
      - name: Build Next.js frontend
        env:
          NEXT_PUBLIC_WS_URL: ${{ secrets.NEXT_PUBLIC_WS_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          DRIZZLE_DATABASE_URL: ${{ secrets.DRIZZLE_DATABASE_URL }}
          NODE_ENV: production
        run: pnpm --filter web build

      # ── 12. Setup Docker Buildx ───────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 13. Build Docker images ───────────────────────────
      - name: Build Docker images
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          JWT_ALGORITHM: ${{ secrets.JWT_ALGORITHM }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          DRIZZLE_DATABASE_URL: ${{ secrets.DRIZZLE_DATABASE_URL }}
          NEXT_PUBLIC_WS_URL: ${{ secrets.NEXT_PUBLIC_WS_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
        run: docker compose build

      # ── 14. Done ──────────────────────────────────────────
      - name: Build summary
        run: |
          echo "=================================="
          echo "🚀 ChatApp Build Complete"
          echo "✅ Frontend built"
          echo "✅ Backend built"
          echo "✅ Docker images built"
          echo "=================================="
name: Deploy from GHCR

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/meetoza28

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read
      packages: read

    steps:
      # ── 1. Checkout ───────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Docker Buildx ────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 3. Login to GHCR ──────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 4. Pull images from GHCR ──────────────────────────
      - name: Pull web image
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          docker pull ${IMAGE_PREFIX}/chatapp-web:${IMAGE_TAG}

      - name: Pull api image
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          docker pull ${IMAGE_PREFIX}/chatapp-api:${IMAGE_TAG}

      # ── 5. Run containers ─────────────────────────────────
      - name: Run containers
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          JWT_ALGORITHM: ${{ secrets.JWT_ALGORITHM }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          DRIZZLE_DATABASE_URL: ${{ secrets.DRIZZLE_DATABASE_URL }}
          NEXT_PUBLIC_WS_URL: ${{ secrets.NEXT_PUBLIC_WS_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
        run: |
          docker compose up -d
          sleep 5
          docker compose ps

      # ── 6. Done ───────────────────────────────────────────
      - name: Deployment summary
        run: |
          echo "=================================="
          echo "🚀 ChatApp CI/CD Complete"
          echo "✅ Frontend built"
          echo "✅ Backend built"
          echo "✅ Docker images built"
          echo "=================================="
name: ChatApp CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ─────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        uses: actions/checkout@v4

      # ── 2. Setup Node.js ────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── 3. Setup pnpm ───────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      # ── 4. Install dependencies ─────────────────────────────
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      # ── 5. Setup Python ─────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # ── 6. Install uv ───────────────────────────────────────
      - name: Install uv
        run: pip install uv
        run: pip install uv

      # ── 7. Install backend dependencies ─────────────────────
      - name: Install backend dependencies
        run: |
          cd apps/api
          uv sync --frozen --no-dev
        run: |
          cd apps/api
          uv sync --frozen --no-dev

      # ── 8. Build Next.js frontend ───────────────────────────
      - name: Build Next.js frontend
        env:
          NEXT_PUBLIC_WS_URL: ws://localhost:8001
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: http://localhost:3000
          DRIZZLE_DATABASE_URL: postgresql://test:test@localhost:5432/test
          NODE_ENV: production
        run: pnpm --filter web build

      # ── 9. Validate Docker Compose ──────────────────────────
      - name: Validate Docker Compose config
        env:
          JWT_SECRET_KEY: placeholder
          GROQ_API_KEY: placeholder
          BETTER_AUTH_SECRET: placeholder
          DRIZZLE_DATABASE_URL: postgresql://placeholder:placeholder@postgres:5432/placeholder
          DATABASE_URL: postgresql+asyncpg://placeholder:placeholder@postgres:5432/placeholder
        run: docker compose config
        run: docker compose config

      # ── 10. Build Docker images ─────────────────────────────
  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build Docker images
        env:
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ env.BETTER_AUTH_URL }}
          DRIZZLE_DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@postgres:5432/${{ env.POSTGRES_DB }}
          DATABASE_URL: postgresql+asyncpg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@postgres:5432/${{ env.POSTGRES_DB }}
          NEXT_PUBLIC_WS_URL: ${{ env.NEXT_PUBLIC_WS_URL }}
          NEXT_PUBLIC_APP_URL: ${{ env.NEXT_PUBLIC_APP_URL }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          GROQ_MODEL: ${{ env.GROQ_MODEL }}
          JWT_ALGORITHM: ${{ env.JWT_ALGORITHM }}
        run: docker compose build
        env:
          POSTGRES_USER: chatapp
          POSTGRES_PASSWORD: chatapp_secret
          POSTGRES_DB: chatapp_db
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          JWT_ALGORITHM: HS256
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: llama-3.3-70b-versatile
        run: docker compose build

      # ── 11. Done ────────────────────────────────────────────
      - name: Deployment summary
        run: |
          echo "=================================="
          echo "ChatApp CI/CD complete"
          echo "Validation passed"
          echo "Docker images built on main branch"
          echo "=================================="
        run: |
          echo "=================================="
          echo "🚀 ChatApp CI/CD Complete"
          echo "✅ Frontend built"
          echo "✅ Backend built"
          echo "✅ Docker images built"
          echo "=================================="